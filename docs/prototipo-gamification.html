<title>Paroliere in gioco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Mondo a fumetto, un solo aspetto voluto (niente tema scuro dell'interfaccia: la scena ha giorno e notte).
   Layout: ogni schermata riempie esattamente lo schermo, niente scorrimento; la Home è la scena del ramo. */
:root{
  color-scheme:light;
  --ink:#1d1a3a; --ink-2:#4b4775;
  --paper:#fffaf0; --paper-2:#f3ead8;
  --blue:#2f6bff; --blue-d:#1c45c2; --blue-l:#dbe6ff;
  --gold:#ffc53d; --gold-d:#d99500; --gold-l:#fff1c7;
  --coral:#ff5e4b; --coral-d:#cf3a28; --coral-l:#ffe0da;
  --mint:#25c88d; --mint-d:#139466; --mint-l:#d4f7e8;
  --grey:#cdd3e3; --grey-d:#9aa3bd;
  --tile:#fffaf0; --tile-sel:#ffd45e;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#2a3f9e;color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:15px;line-height:1.35}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
p{margin:0}

/* cornice */
.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:28px;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.08) 2px,transparent 3px) 0 0/26px 26px,#2a3f9e}
.app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--blue)}
.map-aside{display:none}
@media (min-width:900px){
  .app{width:400px;height:min(860px,calc(100% - 40px));border-radius:40px;border:4px solid var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.35)}
  .map-aside{display:block;width:280px;max-height:calc(100% - 40px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.pattern{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.13) 2.5px,transparent 3.5px) 0 0/24px 24px,linear-gradient(180deg,#3d7bff,#2a55e0)}

/* elementi a fumetto */
.btn{border:3px solid var(--ink);border-radius:18px;padding:10px 18px;font-family:var(--f-display);font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s;
  background:var(--paper);color:var(--ink);text-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn svg{width:22px;height:22px}
.btn-gold{background:linear-gradient(180deg,#ffd768,var(--gold));}
.btn-blue{background:linear-gradient(180deg,#5b8cff,var(--blue));color:#fff;text-shadow:0 2px 0 var(--blue-d)}
.btn-coral{background:linear-gradient(180deg,#ff8270,var(--coral));color:#fff;text-shadow:0 2px 0 var(--coral-d)}
.btn-mint{background:linear-gradient(180deg,#4fdba7,var(--mint));color:#fff;text-shadow:0 2px 0 var(--mint-d)}
.btn-big{font-size:1.6rem;min-height:66px;border-radius:22px;padding:10px 26px}
.btn-sm{min-height:40px;font-size:.95rem;padding:6px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn-block{width:100%}
.btn:disabled{filter:grayscale(1);opacity:.6}
.round{width:52px;height:52px;border-radius:50%;padding:0;min-height:0;flex:none;position:relative}
.round svg{width:26px;height:26px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 rgba(29,26,58,.35)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;font-family:var(--f-display);font-size:1rem;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.pill svg{width:22px;height:22px}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;border:2.5px solid var(--ink);font-family:var(--f-display);font-size:.8rem;display:grid;place-items:center;padding:0 4px}
.lockb{position:absolute;bottom:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:var(--grey);border:2.5px solid var(--ink);display:grid;place-items:center}
.lockb svg{width:13px;height:13px}
.info{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:1rem;display:inline-grid;place-items:center;padding:0;box-shadow:0 2px 0 var(--ink);flex:none;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;border:2.5px solid var(--ink);border-radius:12px;padding:3px 10px;font-family:var(--f-display);font-size:1rem;background:var(--paper);white-space:nowrap}
.chip.gold{background:var(--gold-l)}.chip.blue{background:var(--blue-l)}.chip.coral{background:var(--coral-l)}.chip.mint{background:var(--mint-l)}
.xpbar{height:14px;border-radius:8px;border:2.5px solid var(--ink);background:#e9e2cf;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(180deg,#ffe07a,var(--gold));border-right:2.5px solid var(--ink);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xpbar.blue i{background:linear-gradient(180deg,#7aa2ff,var(--blue))}
.outline-text{color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.muted{color:var(--ink-2);font-weight:700}
.avatar{width:40px;height:40px;border-radius:14px;border:3px solid var(--ink);background:var(--gold-l);display:grid;place-items:center;font-family:var(--f-display);font-size:1.15rem;flex:none;text-transform:uppercase}

/* HOME / scena */
.scene-wrap{position:absolute;inset:0}
.scene-wrap svg{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;z-index:3;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.lvl{display:flex;align-items:center;gap:0;flex:1;min-width:0;background:none;border:0;padding:0}
.lvl .star{width:50px;height:50px;flex:none;position:relative;z-index:1;display:grid;place-items:center}
.lvl .star svg{position:absolute;inset:0;width:100%;height:100%}
.lvl .star b{position:relative;font-family:var(--f-display);font-weight:400;font-size:1.25rem;color:var(--ink)}
.lvl .xpbar{flex:1;max-width:120px;margin-left:-10px;height:18px;border-radius:0 10px 10px 0}
.weekpill{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:3;display:flex;gap:6px;align-items:center}
.weekpill .pill{padding:3px 6px 3px 12px;font-size:.95rem}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:flex-end;justify-content:center;gap:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dock .round{width:62px;height:62px}
.dock .round svg{width:30px;height:30px}
.dock .lab{display:block;font-family:var(--f-display);font-size:.8rem;text-align:center;margin-top:4px}
.dock .lab.white{color:#fff;text-shadow:0 2px 0 var(--ink),-1px 0 0 var(--ink),1px 0 0 var(--ink)}
.dock .play{min-width:150px}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle.face{stroke:var(--gold);stroke-width:5}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
.sloth-bob{animation:bob 5s ease-in-out infinite;transform-origin:0 0}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.blink{animation:blink 6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.fall{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-30px) rotate(0)}to{transform:translate(-40px,900px) rotate(320deg)}}
.cloud{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.bubble-pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

/* GIOCO */
.gtop{display:flex;align-items:center;gap:8px}
.gtop .title{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstats{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.timer{font-family:var(--f-display);font-size:1.7rem;padding:2px 16px 2px 6px}
.timer.low{background:var(--coral-l);animation:shake .5s infinite}
.score{font-family:var(--f-display);font-size:1.7rem;padding:2px 16px 2px 6px}
.coach{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:56px}
.coach .head{width:50px;height:50px;flex:none}
.coach .say{position:relative;flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-family:var(--f-display);font-size:1.05rem;box-shadow:0 4px 0 rgba(29,26,58,.35)}
.coach .say::before{content:"";position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:10px solid var(--ink)}
.coach .say::after{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:7px solid var(--paper)}
.coach .say b{color:var(--coral-d);font-weight:400}
.board-area{flex:1;min-height:0;display:grid;place-items:center;margin-top:10px}
.board-wrap{position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.board{--n:4;--gap:9px;width:100%;height:100%;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:var(--gap);padding:12px;border-radius:26px;
  background:linear-gradient(180deg,#1f3fae,#162f8a);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);position:relative}
.board.n5{--n:5;--gap:7px}.board.n6{--n:6;--gap:6px;padding:9px}
.tile{border-radius:14px;background:var(--tile);border:3px solid var(--ink);display:grid;place-items:center;position:relative;z-index:1;
  font-family:var(--f-display);text-transform:uppercase;color:var(--ink);box-shadow:inset 0 -5px 0 rgba(29,26,58,.18);transition:transform .08s,background .1s}
.tile.sel{background:var(--tile-sel);transform:scale(.92)}
.tile.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{background:var(--tile-sel);transform:scale(.94)}}
.board.n6 .tile{border-width:2.5px;border-radius:10px}
.tile .bonus{position:absolute;top:-8px;right:-8px;font-size:.75rem;padding:1px 5px;border-radius:8px;background:var(--coral);color:#fff;border:2px solid var(--ink);font-family:var(--f-display);text-transform:none}
.tile .bonus.x2{background:var(--mint)}
.board svg.path{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.board svg.path polyline{fill:none;stroke:var(--coral);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.current{height:52px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.current .w{font-family:var(--f-display);font-size:2rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.fb{font-family:var(--f-display);font-size:1.05rem;padding:4px 12px;border-radius:12px;border:3px solid var(--ink)}
.fb.ok{background:var(--mint)}.fb.dup{background:var(--gold)}.fb.no{background:var(--coral);color:#fff}.fb.short{background:var(--grey)}
.shake{animation:shake .32s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.floater{position:absolute;z-index:5;pointer-events:none;font-family:var(--f-display);font-size:2rem;color:var(--gold);animation:float .9s ease-out forwards;
  text-shadow:0 3px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink),0 -2px 0 var(--ink)}
@keyframes float{from{opacity:1;transform:translate(-50%,0) scale(.8)}30%{transform:translate(-50%,-20px) scale(1.2)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;min-height:40px}
.strip::-webkit-scrollbar{display:none}
.wchip{flex:none;padding:3px 10px;border-radius:10px;background:var(--paper);border:2.5px solid var(--ink);font-family:var(--f-display);font-size:.95rem;text-transform:uppercase;letter-spacing:.03em}
.wchip.new{background:var(--gold)}
.wchip.mine{background:var(--blue-l)}
button.wchip[aria-pressed="true"]{background:var(--blue);color:#fff}
.combo{font-family:var(--f-display);color:var(--gold);font-size:1.1rem;text-shadow:0 2px 0 var(--ink)}
.countdown{position:absolute;inset:0;z-index:10;display:grid;place-items:center}
.countdown b{font-family:var(--f-display);font-size:7rem;color:var(--gold);animation:pop .9s ease-out;text-shadow:0 6px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),0 -4px 0 var(--ink)}
@keyframes pop{from{transform:scale(1.8);opacity:0}30%{opacity:1}to{transform:scale(1)}}

/* RIEPILOGO */
.sum{justify-content:space-between;gap:12px}
.burst{position:relative;width:min(70vw,250px);aspect-ratio:1;max-width:100%;margin:0 auto;display:grid;place-items:center}
.burst svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.burst .v{position:relative;text-align:center;animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.burst .v b{display:block;font-family:var(--f-display);font-size:4rem;line-height:1;color:#fff;text-shadow:0 5px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 -3px 0 var(--ink)}
.burst .v span{font-family:var(--f-display);font-size:1.3rem;color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bub{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px 4px;text-align:center;box-shadow:0 4px 0 rgba(29,26,58,.35);position:relative}
.bub b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.1}
.bub span{font-size:.72rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.bub .info{position:absolute;top:-10px;right:-8px;width:24px;height:24px;font-size:.85rem}
.lvlrow{display:flex;align-items:center;gap:10px}
.lvlrow .xpbar{flex:1;height:18px}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(18,16,40,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;background:var(--paper);border-top:4px solid var(--ink);border-radius:30px 30px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,.9,.3,1.1);max-height:92%;overflow:hidden}
.sheet.mid{margin:16px;border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.35);align-self:center;align-items:center;text-align:center;max-width:360px;width:calc(100% - 32px)}
.scrim.centered{align-items:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{flex:1;min-width:0;font-size:1.5rem}
.x{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink);flex:none}
.x svg{width:18px;height:18px}
.vbadge{width:58px;height:58px;border-radius:18px;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;box-shadow:0 4px 0 var(--ink);flex:none}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--paper);border:3px solid var(--ink);padding:8px 16px;border-radius:16px;font-family:var(--f-display);font-size:1.05rem;max-width:calc(100% - 32px);box-shadow:0 4px 0 var(--ink);animation:up .25s;text-align:center}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;text-align:center}
.podium .p{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.podium .p .avatar{width:44px;height:44px}
.podium .p .blk{width:100%;border:3px solid var(--ink);border-radius:12px 12px 4px 4px;font-family:var(--f-display);font-size:1.1rem;display:grid;place-items:center}
.podium .p .nm{font-size:.78rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{display:grid;grid-template-columns:28px 36px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:14px;width:100%;background:none;border:0;text-align:left}
.rank .pos{font-family:var(--f-display);font-size:1.1rem;text-align:center}
.rank .avatar{width:34px;height:34px;font-size:.95rem;border-width:2.5px;border-radius:11px}
.rank .sc{font-family:var(--f-display);font-size:1.2rem}
.rank.me{background:var(--gold-l);border:2.5px solid var(--ink)}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--paper-2);border:3px solid var(--ink);border-radius:16px;padding:4px}
.tabs button{border:0;background:none;border-radius:11px;padding:7px;font-family:var(--f-display);font-size:1rem;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--ink)}
.token{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#ffe9a0,var(--gold));display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem;box-shadow:0 4px 0 var(--ink);flex:none}
.token.off{background:var(--grey);color:var(--ink-2)}
.toggle-help{display:flex;align-items:center;gap:10px;border:3px dashed var(--ink);border-radius:18px;padding:8px 10px;background:none;width:100%;text-align:left}
.toggle-help[aria-pressed="true"]{border-style:solid;background:var(--gold-l)}
.check{width:30px;height:30px;border-radius:10px;border:3px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.check svg{width:18px;height:18px}
.toggle-help[aria-pressed="true"] .check{background:var(--mint)}
.wgrid{display:flex;flex-wrap:wrap;gap:6px;overflow:auto;align-content:flex-start;min-height:0}
.miniboard{--n:4;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;padding:7px;border-radius:16px;background:#1f3fae;border:3px solid var(--ink);width:150px;position:relative;flex:none}
.miniboard .tile{aspect-ratio:1;border-width:2px;border-radius:7px;font-size:.95rem;box-shadow:inset 0 -3px 0 rgba(29,26,58,.18)}
.miniboard.n5 .tile{font-size:.8rem}.miniboard.n6 .tile{font-size:.65rem;border-radius:5px}
.miniboard svg.path polyline{stroke-width:5}
.miniboard.hl .tile:not(.sel){opacity:.5}
.medals{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px}
.medal{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0}
.medal .m{width:54px;height:54px;max-width:100%;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem;box-shadow:0 3px 0 var(--ink);
  background:radial-gradient(circle at 35% 30%,#ffe9a0,var(--gold))}
.medal .m.week{background:radial-gradient(circle at 35% 30%,#b9ceff,#5b8cff);color:#fff;text-shadow:0 2px 0 var(--ink)}

function sceneGeom(W,H){
  const top=Math.max(175,H*.2),bottom=H-Math.max(170,H*.2);
  const xs=[.30,.70,.30,.70,.30,.70,.50];
  const nodes=xs.map((x,i)=>({x:W*x,y:bottom-(bottom-top)*i/6}));

  const d="M"+pts[0].x+" "+pts[0].y+segs.map(s=>` C${s[1].x} ${s[1].y} ${s[2].x} ${s[2].y} ${s[3].x} ${s[3].y}`).join("");
  return {W,H,nodes,segs,d};
}

function startGame(kind,opt){

  if(kind==="gioca"||kind==="guided"){grid=GIOCA[S.giocaIdx%GIOCA.length];S.giocaIdx++;label=kind==="guided"?"Prima partita":"Gioca 5×5"}
  else if(kind==="week"){const w=WEEK[opt.day];grid=w;dur=w.dur+(opt.aiuto?10:0);min=w.min;bonus=w.bonus;variant=w.v.id;label=`${DAYS[opt.day]} · ${w.v.name}`}
  else{grid=DUEL;label=`Sfida con ${opt.opp}`;variant="versus"}
  let hint=null;if(kind==="guided"){const w=grid.hint||grid.words.find(x=>x.length===4);hint={word:w,path:findPath(grid,w),step:0}}
  S.game={kind,day:opt.day,aiuto:opt.aiuto,opp:opt.opp,cid:opt.cid,grid,variant,dur:dur*1000,left:dur*1000,min,bonus,
    found:[],score:0,combo:0,maxCombo:0,lastAt:0,path:[],running:false,countdown:kind==="guided"?0:3,label,hint,paused:kind==="guided"};
  document.getElementById("overlay").innerHTML="";go("partita");
}
function vGame(){const g=S.game,N=g.grid.N;
  return `<div class="screen pattern">
    <div class="gtop"><button class="x" data-act="quit" aria-label="Esci">${I.close}</button><div class="title outline-text">${esc(g.label)}</div>${g.aiuto?`<span class="chip gold">+10s</span>`:`<span style="width:38px"></span>`}</div>
    <div class="gstats"><span class="pill timer num ${g.left<=15000?"low":""}" id="timer"><span style="width:30px;height:30px;border-radius:50%;background:var(--blue);border:2.5px solid var(--ink);color:#fff;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></span>${mmss(g.left)}</span>
      <span class="combo" id="combo"></span>
      <span class="pill score num" id="score"><span style="width:30px;height:30px;display:grid;place-items:center">${STAR("#ffc53d")}</span>${g.score}</span></div>
    ${g.hint&&g.hint.step<3?coachHTML():`<div class="coach" style="min-height:0;margin-top:0"></div>`}
    <div class="board-area" id="barea"><div class="board-wrap" id="bw">
      <div class="board n${N}" id="board">${g.grid.letters.map((l,i)=>`<div class="tile ${g.hint&&g.hint.step===0&&g.hint.path.includes(i)?"hint":""}" data-i="${i}">${l}${g.bonus[i]?`<span class="bonus ${g.bonus[i]===2?"x2":""}">×${g.bonus[i]}</span>`:""}</div>`).join("")}<svg class="path"><polyline points=""/></svg></div>
      ${g.countdown?`<div class="countdown" id="cd"><b>${g.countdown}</b></div>`:""}</div></div>
    <div class="current" id="cur" aria-live="polite"></div>
    <div class="strip" id="found"></div>
  </div>`}
function coachHTML(){const h=S.game.hint;const T=[`Trascina: <b>${h.word.toUpperCase()}</b>`,`Punti = <b>XP</b>!`,`<b>Giallo</b> = parola nuova!`];
  return `<div class="coach" id="coach">${slothHead()}<div class="say bubble-pop">${T[h.step]}</div></div>`}
function mmss(ms){const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function fitBoard(){const a=document.getElementById("barea"),bw=document.getElementById("bw");if(!a||!bw)return;const s=Math.floor(Math.min(a.clientWidth,a.clientHeight-8));bw.style.width=s+"px";bw.style.height=s+"px";
  const t=document.querySelector("#board .tile");if(t){const fs=t.clientWidth*.55;document.querySelectorAll("#board .tile").forEach(x=>x.style.fontSize=fs+"px")}}
let tick=null;
after.partita=function(){const g=S.game;fitBoard();bindBoard();
  if(g.countdown){const cd=()=>{g.countdown--;const el=document.getElementById("cd");if(!el)return;if(g.countdown<=0){el.remove();startClock()}else{el.innerHTML=`<b>${g.countdown}</b>`;beep(520);setTimeout(cd,700)}};beep(520);setTimeout(cd,700)}
  else if(!g.paused)startClock()};
function setTimer(){const g=S.game,t=document.getElementById("timer");if(!t)return;t.lastChild.textContent=mmss(g.left);t.classList.toggle("low",g.left<=15000)}
function startClock(){const g=S.game;g.countdown=0;g.paused=false;g.running=true;g.t0=performance.now()-(g.dur-g.left);beep(880,.15);clearInterval(tick);
  tick=setInterval(()=>{const g=S.game;if(!g||!g.running){clearInterval(tick);return}g.left=Math.max(0,g.dur-(performance.now()-g.t0));setTimer();
    if(g.left<=10000&&Math.ceil(g.left/1000)!==g.lastTick){g.lastTick=Math.ceil(g.left/1000);beep(300,.05,"sine",.04)}
    if(g.combo>=2&&performance.now()-g.lastAt>5000)g.combo=0;const c=document.getElementById("combo");if(c)c.textContent=g.variant==="combo"&&g.combo>=2?`COMBO ×${g.combo}`:"";
    if(g.left<=0)endGame()},100)}
function bindBoard(){const board=document.getElementById("board");if(!board)return;const g=S.game;let active=false;
  const tileAt=(x,y)=>{const el=document.elementFromPoint(x,y);const t=el&&el.closest(".tile");if(!t||!board.contains(t))return -1;const r=t.getBoundingClientRect();return Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2)<=r.width*.5?+t.dataset.i:-1};
  const draw=()=>{board.querySelectorAll(".tile").forEach((t,i)=>t.classList.toggle("sel",g.path.includes(i)));drawPath(board,g.path);const w=g.path.map(i=>g.grid.letters[i]).join("");document.getElementById("cur").innerHTML=w?`<span class="w">${w}</span>`:""};
  board.addEventListener("pointerdown",e=>{if(g.countdown||!S.game)return;const i=tileAt(e.clientX,e.clientY);if(i<0)return;active=true;g.path=[i];board.setPointerCapture(e.pointerId);draw();beep(400+g.path.length*40,.04,"sine",.03);e.preventDefault()});
  board.addEventListener("pointermove",e=>{if(!active)return;const i=tileAt(e.clientX,e.clientY);if(i<0)return;const p=g.path;if(i===p[p.length-1])return;
    if(p.length>1&&i===p[p.length-2]){p.pop();draw();return}if(!p.includes(i)&&adjN(p[p.length-1],i,g.grid.N)){p.push(i);draw();beep(400+p.length*40,.04,"sine",.03)}});
  const up=()=>{if(!active)return;active=false;submit()};board.addEventListener("pointerup",up);board.addEventListener("pointercancel",up)}
function drawPath(board,path){const tiles=board.querySelectorAll(".tile"),br=board.getBoundingClientRect();board.querySelector("polyline").setAttribute("points",path.map(i=>{const r=tiles[i].getBoundingClientRect();return `${r.left-br.left+r.width/2},${r.top-br.top+r.height/2}`}).join(" "))}
const isNew=w=>!S.collection.has(w);
function submit(){const g=S.game,w=g.path.map(i=>g.grid.letters[i]).join(""),cur=document.getElementById("cur"),board=document.getElementById("board");let fb,cls;
  if(w.length<g.min){fb=g.min>3&&w.length>=3?"Min 4!":"Corta";cls="short"}
  else if(g.found.includes(w)){fb="Già presa";cls="dup"}
  else if(!g.grid.set.has(w)){fb="No!";cls="no"}
  else{let mult=1;g.path.forEach(i=>{if(g.bonus[i])mult*=g.bonus[i]});
    const now=performance.now();g.combo=(g.combo>=1&&now-g.lastAt<=5000)?g.combo+1:1;g.lastAt=now;g.maxCombo=Math.max(g.maxCombo,g.combo);
    const extra=g.variant==="combo"&&g.combo>=2?g.combo-1:0,pts=base(w)*mult+extra;g.found.push(w);g.score+=pts;
    fb=`+${pts}`;cls="ok";buzz(15);beep(520+Math.min(g.combo,8)*50,.12);if(w.length>=6)setTimeout(()=>beep(990,.15),90);
    const t=board.querySelectorAll(".tile")[g.path[g.path.length-1]],br=document.getElementById("bw").getBoundingClientRect(),r=t.getBoundingClientRect();
    const f=document.createElement("div");f.className="floater";f.textContent="+"+pts+(mult>1?" ×"+mult:"");f.style.left=(r.left-br.left+r.width/2)+"px";f.style.top=(r.top-br.top-10)+"px";document.getElementById("bw").appendChild(f);setTimeout(()=>f.remove(),900);
    const sc=document.getElementById("score");sc.lastChild.textContent=g.score;
    document.getElementById("found").innerHTML=g.found.slice().reverse().map(x=>`<span class="wchip ${isNew(x)?"new":""}">${x}</span>`).join("");
    if(w.length>=7)toast(`${w.length} lettere!`);
    if(g.hint&&g.hint.step<3){if(g.hint.step===0){g.hint.step=1;board.querySelectorAll(".hint").forEach(x=>x.classList.remove("hint"));startClock()}else if(g.found.length>=3&&g.hint.step===1)g.hint.step=2;else if(g.found.length>=6&&g.hint.step===2)g.hint.step=3;
      const c=document.getElementById("coach");if(c)c.outerHTML=g.hint.step<3?coachHTML():"";fitBoard()}}
  cur.innerHTML=`${w?`<span class="w">${w}</span>`:""}<span class="fb ${cls}">${fb}</span>`;
  if(cls==="no"){board.classList.remove("shake");void board.offsetWidth;board.classList.add("shake");beep(160,.15,"sawtooth",.04);buzz([20,40,20])}
  setTimeout(()=>{if(!S.game)return;g.path=[];board.querySelectorAll(".tile").forEach(t=>t.classList.remove("sel"));board.querySelector("polyline").setAttribute("points","")},cls==="ok"?160:260);
  clearTimeout(g.fbT);g.fbT=setTimeout(()=>{const c=document.getElementById("cur");if(c&&!g.path.length)c.innerHTML=""},1100)}

function award(id,list){if(!S.medals.has(id)){S.medals.add(id);list.push(MEDALS.find(m=>m[0]===id))}}
function addXP(n){S.xp+=n;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++}}
function endGame(){const g=S.game;if(!g)return;g.running=false;clearInterval(tick);beep(440,.2);setTimeout(()=>beep(330,.3),180);buzz(80);
  const got=[],newWords=g.found.filter(isNew);newWords.forEach(w=>S.collection.add(w));g.found.forEach(w=>{if(w.length>S.longest.length)S.longest=w});S.games++;
  let final=g.score,provisional=false;
  if(g.kind==="week"){S.week[g.day]={words:g.found.slice(),score:g.score,final:g.score,aiuto:!!g.aiuto,onDay:g.day===S.day};
    if(g.variant==="uniche"){refreshUnique();final=S.week[g.day].final;provisional=true}
    S.variantsPlayed.add(g.variant);award("sett1",got);if(S.variantsPlayed.size>=7)award("tutto",got);
    if(Object.keys(S.week).length===7){award("sett7",got);if(Object.values(S.week).every(r=>r.onDay))award("puntuale",got)}}
  let gift=false,up=false;if(!S.playedToday){S.playedToday=true;S.streak++;up=true;if(S.streak>=10){S.streak=0;S.cycles++;S.aiuti++;gift=true;award("ciclo",got)}}
  if(g.found.length)award("parola",got);award("partita",got);
  if(S.collection.size>=100)award("p100",got);if(S.collection.size>=1000)award("p1000",got);if(S.collection.size>=10000)award("p10000",got);
  if(g.found.some(w=>w.length>=7))award("l7",got);if(g.found.some(w=>w.length>=9))award("l9",got);if(g.found.length>=30)award("w30",got);
  const before=S.level,xpBefore=S.xp;addXP(final);if(S.level>=10)award("lv10",got);
  S.last={kind:g.kind,day:g.day,grid:g.grid,found:g.found.slice(),score:g.score,final,provisional,newWords,label:g.label,before,xpBefore,levels:S.level-before,got,up,gift,aiuto:g.aiuto};
  S.ui.sumSel=null;S.ui.sumTab="trovate";if(g.kind==="guided")S.onboarded=true;
  if(S.level>before)pending.push(()=>levelModal(before));if(gift)pending.push(giftModal);got.forEach(m=>pending.push(()=>medalModal(m)));
  const kind=g.kind,cid=g.cid;S.game=null;if(kind==="duel"){finishDuel(cid);return}go("riepilogo")}

      <span class="xpbar grow"><i id="xpfill" style="width:${r.levels?0:r.xpBefore/need*100}%"></i></span><span class="num" style="font-family:var(--f-display);font-size:.95rem">${S.xp}/${need}</span></div></div>

function oppWords(o){const P={3:.25,4:.18,5:.1,6:.05};return DUEL.words.filter(w=>hash(w+"@"+o)<(P[w.length]||.03))}
function versus(m,t){const A=new Set(m),B=new Set(t),uA=m.filter(w=>!B.has(w)),uB=t.filter(w=>!A.has(w)),c=m.filter(w=>B.has(w));return {uA,uB,c,sA:uA.reduce((s,w)=>s+2*base(w),0)+c.reduce((s,w)=>s+base(w),0),sB:uB.reduce((s,w)=>s+2*base(w),0)+c.reduce((s,w)=>s+base(w),0)}}
function finishDuel(id){const c=S.challenges.find(x=>x.id===id);c.myWords=S.last.found;c.me=S.last.score;c.xpGiven=S.last.score;

  if(v.sA>v.sB)S.record.w++;else S.record.l++;const extra=v.sA-(c.xpGiven||0);if(extra>0)addXP(extra);c.xpGiven=v.sA;S.lastDuel={c,v};go("esito")}
function vDuelResult(){const {c,v}=S.lastDuel,win=v.sA>v.sB;

    <div class="gtop"><span style="width:38px"></span><div class="title outline-text">Sfida con ${c.opp}</div><span style="width:38px"></span></div>
    <h1 class="center outline-text" style="font-size:3rem">${win?"Vinta!":v.sA===v.sB?"Pari!":"Persa!"}</h1>
    <div class="panel vs"><div><span class="avatar" style="margin:0 auto;width:54px;height:54px">T</span><div class="s num ${win?"win":""}">${v.sA}</div><span class="muted">Tu</span></div><span style="font-family:var(--f-display);font-size:1.4rem">VS</span><div><span class="avatar" style="margin:0 auto;width:54px;height:54px">${c.opp[0]}</span><div class="s num ${v.sB>v.sA?"win":""}">${v.sB}</div><span class="muted">${c.opp}</span></div></div>
    <div class="trio"><div class="bub"><b class="num" style="color:var(--gold-d)">${v.uA.length}</b><span>solo tue ×2</span></div><div class="bub"><b class="num">${v.c.length}</b><span>in comune</span></div><div class="bub"><b class="num" style="color:var(--blue)">${v.uB.length}</b><span>solo sue ×2</span></div></div>
    <div class="row"><button class="btn btn-block" data-go="sfide">Sfide</button><button class="btn btn-coral btn-block" data-crematch="${c.id}">Rivincita</button></div>
    <button class="btn btn-gold btn-big btn-block" data-go="home">Home</button></div>`}
after.esito=function(){fanfare();nextModal()};

/* ---------- modali ---------- */
function toast(t){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.getElementById("app").appendChild(el);setTimeout(()=>el.remove(),2200)}
function welcome(){sheet(`<svg viewBox="-40 -14 110 70" width="170" height="108">${slothSVG().replace('class="sloth-bob"','')}<path d="M-40 -2 H70" stroke="#1d1a3a" stroke-width="12" stroke-linecap="round"/><path d="M-40 -2 H70" stroke="#7a4a2c" stroke-width="7" stroke-linecap="round"/></svg>
  <h1 style="font-size:2.4rem">Paroliere</h1><p class="muted" style="font-size:1.05rem">Trascina, trova parole, sali di livello.</p>
  <button class="btn btn-gold btn-big btn-block" data-act="start-guided">Gioca</button>`,"mid")}
function afterGuided(){sheet(`<svg viewBox="-40 -14 110 70" width="150" height="96">${slothSVG().replace('class="sloth-bob"','')}<path d="M-40 -2 H70" stroke="#1d1a3a" stroke-width="12" stroke-linecap="round"/><path d="M-40 -2 H70" stroke="#7a4a2c" stroke-width="7" stroke-linecap="round"/></svg>
  <h1>Ogni giorno salgo di un ramo</h1><p class="muted" style="font-size:1.05rem">Una griglia nuova al giorno, uguale per tutti.</p><button class="btn btn-gold btn-big btn-block" data-close>Vediamo!</button>`,"mid")}
function levelModal(before){fanfare();const un=before<5&&S.level>=5;
  sheet(`<span style="width:130px;height:130px;position:relative;display:grid;place-items:center" class="bubble-pop">${STAR("#ffc53d")}<b class="num" style="position:relative;font-family:var(--f-display);font-weight:400;font-size:2.8rem">${S.level}</b></span>
  <h1 style="font-size:2.2rem">Livello ${S.level}!</h1>${un?`<span class="chip coral" style="font-size:1.1rem">${I.swords.replace("<svg",'<svg width="20" height="20"')} Sfide aperte</span><button class="btn btn-coral btn-big btn-block" data-act="close-go" data-to="sfide">Sfide</button>`:""}
  <button class="btn ${un?"":"btn-gold btn-big"} btn-block" data-close>Ok</button>`,"mid")}
function giftModal(){fanfare();sheet(`<span class="token bubble-pop" style="width:110px;height:110px;font-size:1.8rem">+10s</span><h1 style="font-size:2rem">Serie completata!</h1><p class="muted">Un aiuto per la Settimana</p><button class="btn btn-gold btn-big btn-block" data-close>Evviva</button>`,"mid")}
function medalModal(m){beep(784,.1);setTimeout(()=>beep(1175,.25),120);sheet(`<span class="medal"><span class="m big ${m[4]}">${m[2]}</span></span><h1 style="font-size:2rem">${m[1]}</h1><p class="muted">${esc(m[3])}</p><button class="btn btn-gold btn-big btn-block" data-close>Ok</button>`,"mid")}

/* ---------- mappa ---------- */
function mapHTML(){return `<h2>Prototipo</h2><p>Nessun server: avversari e classifiche simulati. Griglie vere dal dizionario del progetto. Su telefono la mappa è nel Profilo.</p>
  <h3>Vai a</h3><div class="sim"><button data-go="home">Home · Settimana</button><button data-act="start-gioca">Partita libera</button><button data-go="profilo">Profilo</button><button data-go="sfide">Sfide</button><button data-sheet="classifica">Classifica</button></div>
  <h3>Simula</h3><div class="sim">
    <button data-act="sim-reset">Nuovo giocatore</button><button data-act="sim-skipob">Salta la partita guidata</button>
    <button data-act="sim-xp">+300 XP</button><button data-act="sim-l5">Arriva al livello 5</button>
    <button data-act="sim-day">Giorno dopo</button><button data-act="sim-skip">Salta un giorno</button>
    <button data-act="sim-s9">Serie a 9</button><button data-act="sim-friends">Amici: Giulia e Luca</button><button data-act="sim-chal">Giulia ti sfida</button></div>
  <h3>Scena</h3><div class="tabs" style="margin-top:6px">${[["","Auto"],["autunno","Aut"],["inverno","Inv"],["primavera","Pri"],["estate","Est"]].map(([k,t])=>`<button data-season="${k}" aria-pressed="${(S.season||"")===k}">${t}</button>`).join("")}</div>
  <div class="tabs" style="margin-top:6px">${[["auto","Auto"],["giorno","Giorno"],["notte","Notte"]].map(([k,t])=>`<button data-sky="${k}" aria-pressed="${S.sky===k}">${t}</button>`).join("")}</div>`}

/* ---------- azioni ---------- */
function refreshSheet(){if(openSheet)openSheet()}
function onAct(el){const d=el.dataset;
  if(d.close!==undefined){if(!infoReturn)openSheet=null;closeSheet();return}
  if(d.go){openSheet=null;document.getElementById("overlay").innerHTML="";go(d.go);return}
  if(d.node!==undefined){const n=+d.node;openSheet=()=>daySheet(n);S.ui.help=false;openSheet();return}
  if(d.sheet){openSheet=SHEETS[d.sheet];openSheet();return}
  if(d.info){infoSheet(d.info);return}
  if(d.grank){S.ui.grank=d.grank;refreshSheet();return}
  if(d.rank){S.ui.rank=d.rank;refreshSheet();return}
  if(d.wlen){S.ui.wlen=d.wlen;refreshSheet();return}
  if(d.sumtab){S.ui.sumTab=d.sumtab;S.ui.sumSel=null;sumWordsSheet();return}
  if(d.sumword){S.ui.sumSel=S.ui.sumSel===d.sumword?null:d.sumword;const sc=(document.querySelector(".sheet .wgrid")||{}).scrollTop||0;sumWordsSheet();const w=document.querySelector(".sheet .wgrid");if(w)w.scrollTop=sc;return}
  if(d.medal){const m=MEDALS.find(x=>x[0]===d.medal);const prev=document.getElementById("overlay").innerHTML;sheet(`<span class="medal"><span class="m big ${m[4]} ${S.medals.has(m[0])?"":"off"}">${m[2]}</span></span><h1>${m[1]}</h1><p class="muted">${esc(m[3])}</p><button class="btn btn-block" data-close>Ok</button>`,"mid");infoReturn=prev;return}
  if(d.toggle){S[d.toggle]=!S[d.toggle];refreshSheet();return}
  if(d.sky){S.sky=d.sky;render();refreshSheet();return}
  if(d.season!==undefined){S.season=d.season||null;render();refreshSheet();return}
  if(d.friend){const n=S.notifs.find(x=>x.id==+d.friend);n.done=true;n.unread=false;if(d.ans==="yes"){S.friends.push(n.who);n.t=`${n.who} è tuo amico!`}else n.t=`Richiesta di ${n.who} ignorata`;render();refreshSheet();return}
  if(d.ngo){document.getElementById("overlay").innerHTML="";openSheet=null;go(d.ngo);return}
  if(d.pick){S.ui.opp=d.pick;newDuelSheet();return}
  if(d.cplay){const c=S.challenges.find(x=>x.id==+d.cplay);startGame("duel",{opp:c.opp,cid:c.id});return}
  if(d.csim){resolveDuel(S.challenges.find(x=>x.id==+d.csim));return}
  if(d.crematch){const c=S.challenges.find(x=>x.id==+d.crematch);S.challenges.unshift({id:Date.now(),opp:c.opp,status:"tocca",oppPlayed:false,lockedOpp:(PLAYER_LEVEL[c.opp]||1)<5});toast(`Rivincita a ${c.opp}!`);go("sfide");return}
  switch(d.act){
    case "start-guided":startGame("guided",{});break;
    case "start-gioca":openSheet=null;startGame("gioca",{});break;
    case "close-go":document.getElementById("overlay").innerHTML="";go(d.to);nextModal();break;
    case "togglehelp":S.ui.help=!S.ui.help;refreshSheet();break;
    case "start-week":{const day=+d.day,aiuto=S.ui.help&&S.aiuti>0;if(aiuto)S.aiuti--;S.ui.help=false;openSheet=null;startGame("week",{day,aiuto});break}
    case "open-day":{const n=+d.day;openSheet=()=>daySheet(n);openSheet();break}
    case "sumwords":openSheet=null;sumWordsSheet();break;
    case "quit":{const g=S.game;sheet(`<h1>Esci?</h1><p class="muted">${g.kind==="week"?"Il tentativo conta comunque.":"Conta il punteggio fatto."}</p><div class="row" style="width:100%"><button class="btn btn-block" data-close>No</button><button class="btn btn-coral btn-block" data-act="endgame">Esci</button></div>`,"mid");break}
    case "endgame":document.getElementById("overlay").innerHTML="";if(S.game&&S.game.hint)S.game.hint.step=3;endGame();break;
    case "newduel":S.ui.opp=null;newDuelSheet();break;
    case "send-duel":{const opp=S.ui.opp||S.friends[0],locked=(PLAYER_LEVEL[opp]||1)<5;S.challenges.unshift({id:Date.now(),opp,status:"tocca",oppPlayed:false,lockedOpp:locked});document.getElementById("overlay").innerHTML="";toast(locked?`${opp} la vedrà al livello 5`:`Sfida inviata a ${opp}!`);render();break}
    case "mapsheet":sheet(`<div class="sheet-head"><h2>Mappa</h2>${X}</div><div class="map" style="overflow:auto;min-height:0">${mapHTML()}</div>`);break;
    case "sim-reset":clearInterval(tick);pending.length=0;infoReturn=null;openSheet=null;_ow={};initState();document.getElementById("overlay").innerHTML="";go("home");break;
    case "sim-skipob":S.onboarded=true;document.getElementById("overlay").innerHTML="";render();break;
    case "sim-xp":{const b=S.level;addXP(300);render();toast("+300 XP");if(S.level>b)levelModal(b);break}
    case "sim-l5":{const b=S.level;if(S.level<5){S.level=5;S.xp=0;render();levelModal(b)}break}
    case "sim-day":newDay(false);break;
    case "sim-skip":newDay(true);break;
    case "sim-s9":S.streak=9;S.playedToday=false;render();toast("Serie a 9");break;
    case "sim-friends":["Giulia","Luca"].forEach(f=>{if(!S.friends.includes(f))S.friends.push(f)});render();toast("Giulia e Luca amici");break;
    case "sim-chal":if(!S.friends.includes("Giulia"))S.friends.push("Giulia");S.challenges.unshift({id:Date.now(),opp:"Giulia",status:"tocca",oppPlayed:true});S.notifs.unshift({id:Date.now(),who:"Giulia",t:"Giulia ti ha sfidato",go:"sfide",unread:true});render();toast("Giulia ti sfida!");break;
  }}
document.addEventListener("click",e=>{const el=e.target.closest("button,[data-scrim],[data-node]");if(!el)return;
  if(el.hasAttribute("data-scrim")){if(e.target===el){if(!infoReturn)openSheet=null;closeSheet()}return}
  if(el.dataset.peek){const n=el.dataset.peek;const day=lastDay;const ws=otherWords(n,day);const mine=S.week[day]?S.week[day].words:[];const back=openSheet,prev=document.getElementById("overlay").innerHTML;
    sheet(`<div class="sheet-head"><span class="avatar">${esc(n[0])}</span><h2 style="flex:1">${esc(n)}</h2>${X}</div><div class="wgrid" style="max-height:50vh">${ws.sort((a,b)=>b.length-a.length).map(w=>`<span class="wchip ${mine.includes(w)?"mine":""}">${w}</span>`).join("")}</div>`);openSheet=back;infoReturn=prev;return}
  onAct(el)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".scrim")){openSheet=null;closeSheet()}
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.node!==undefined){e.preventDefault();onAct(e.target)}});
let lastDay=4;
function newDay(skip){for(let k=0;k<(skip?2:1);k++){if(!S.playedToday)S.streak=0;S.playedToday=false;S.day++;
    if(S.day>6){for(let d=0;d<7;d++){if(S.week[d]){const rows=dayRanking(d,"generale");if(rows[0]&&rows[0].me)S.medals.add("primo")}}S.weekNo++;S.day=0;S.week={};_ow={}}}
  refreshUnique();S.notifs.unshift({id:Date.now(),kind:"day",t:`Griglia di ${DAYS[S.day].toLowerCase()}: ${WEEK[S.day].v.name}`,unread:true});
  document.getElementById("overlay").innerHTML="";openSheet=null;go("home");toast(skip?"Giorno saltato: serie a zero":`${DAYS[S.day]}!`)}
render();
})();
</script>
