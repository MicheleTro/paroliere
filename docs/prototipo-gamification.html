<title>Paroliere in gioco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: colonna da telefono (app) al centro, mappa dei flussi fissa a sinistra su desktop.
   Identità: tessere di ceramica su blu cobalto; zafferano per XP, corallo per la serie, il bradipo per la Settimana. */
:root{
  --bg:#e8eef8; --surface:#ffffff; --surface-2:#dbe4f3; --line:#c5d1e6;
  --ink:#0e1b38; --muted:#56668a;
  --cobalt:#1d4ed8; --cobalt-soft:#d6e1fb; --on-cobalt:#ffffff;
  --saffron:#f0a92a; --saffron-soft:#fdeccb; --on-saffron:#3a2500;
  --coral:#e8513f; --coral-soft:#fbdcd7;
  --mint:#138a69; --mint-soft:#d3f0e6;
  --amber:#a8690f;
  --tile:#fbf8f1; --tile-edge:#c7cfdf; --tile-ink:#10204a; --tile-sel:#ffd577;
  --shadow:0 1px 2px rgba(14,27,56,.08),0 6px 18px rgba(14,27,56,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09112a; --surface:#121c3a; --surface-2:#1b2850; --line:#2a3a68;
  --ink:#e8eefc; --muted:#9aa9cc;
  --cobalt:#7095ff; --cobalt-soft:#1f2f63; --on-cobalt:#08122e;
  --saffron:#f5bd4f; --saffron-soft:#3b2c0f; --on-saffron:#2a1a00;
  --coral:#ff7a68; --coral-soft:#43201e;
  --mint:#43cfa2; --mint-soft:#0f3a30;
  --amber:#f0b45a;
  --tile:#f3efe4; --tile-edge:#8d97b4; --tile-ink:#10204a; --tile-sel:#ffcf66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09112a; --surface:#121c3a; --surface-2:#1b2850; --line:#2a3a68;
  --ink:#e8eefc; --muted:#9aa9cc;
  --cobalt:#7095ff; --cobalt-soft:#1f2f63; --on-cobalt:#08122e;
  --saffron:#f5bd4f; --saffron-soft:#3b2c0f; --on-saffron:#2a1a00;
  --coral:#ff7a68; --coral-soft:#43201e;
  --mint:#43cfa2; --mint-soft:#0f3a30;
  --amber:#f0b45a;
  --tile:#f3efe4; --tile-edge:#8d97b4; --tile-ink:#10204a; --tile-sel:#ffcf66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800;line-height:1.1}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.84rem}

/* shell */
.stage{display:flex;justify-content:center;gap:32px;min-height:100%}
.map-aside{display:none}
@media (min-width:1000px){
  .stage{padding-block:24px}
  .map-aside{display:block;width:300px;flex:none;position:sticky;top:24px;align-self:flex-start;max-height:calc(100vh - 48px);overflow:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
  .app{border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);min-height:calc(100vh - 48px)!important;max-height:calc(100vh - 48px);overflow:auto}
}
.app{width:100%;max-width:460px;background:var(--bg);position:relative;min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:62px}
.topbar .title{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
main{flex:1;padding-block:4px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.tabbar{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--cobalt)}
.tab .lock{position:absolute;top:2px;right:calc(50% - 20px);width:16px;height:16px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.tab .lock svg{width:10px;height:10px}
.tab .dot{top:0;right:calc(50% - 22px)}
.tab-play{margin-top:-26px}
.tab-play span.fab{width:58px;height:58px;border-radius:18px;background:var(--cobalt);color:var(--on-cobalt);display:grid;place-items:center;box-shadow:0 6px 16px rgba(29,78,216,.35);transform:rotate(-4deg)}
.tab-play span.fab svg{width:28px;height:28px}
.app.playing .tabbar{display:none}

/* elementi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn-gold{background:var(--saffron);color:var(--on-saffron)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-quiet{background:transparent;color:var(--cobalt);padding:8px 4px;min-height:auto;font-weight:700}
.btn-sm{min-height:38px;padding:8px 14px;font-size:.88rem}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill svg{width:11px;height:11px}
.pill-mint{background:var(--mint-soft);color:var(--mint)}
.pill-coral{background:var(--coral-soft);color:var(--coral)}
.pill-gold{background:var(--saffron-soft);color:var(--amber)}
.pill-blue{background:var(--cobalt-soft);color:var(--cobalt)}
.pill-grey{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--saffron);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.blue>i{background:var(--cobalt)}
.bar.coral>i{background:var(--coral)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list>.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--tile-ink);background:var(--tile);border:1px solid var(--tile-edge);box-shadow:inset 0 -3px 0 rgba(16,32,74,.12);flex:none;text-transform:uppercase}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px}
.ic-blue{background:var(--cobalt-soft);color:var(--cobalt)}
.ic-gold{background:var(--saffron-soft);color:var(--amber)}
.ic-coral{background:var(--coral-soft);color:var(--coral)}
.ic-mint{background:var(--mint-soft);color:var(--mint)}
.ic-grey{background:var(--surface-2);color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);padding:10px 12px;border-radius:10px;border:1px dashed var(--line)}

/* top bar home */
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.me .lvl{font-family:var(--f-display);font-weight:800;font-size:1rem;line-height:1}
.me .bar{height:6px;width:110px;margin-top:5px}
.streak{display:inline-flex;align-items:center;gap:4px;padding:8px 10px;border-radius:12px;background:var(--coral-soft);color:var(--coral);font-family:var(--f-display);font-weight:800;border:0}
.streak svg{width:18px;height:18px}
.streak small{font-family:var(--f-body);font-weight:700;opacity:.7;font-size:.72rem}

/* scena del bradipo */
.week-card{border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.week-card .scene-btn{display:block;width:100%;padding:0;border:0;background:none}
.scene{display:block;width:100%;height:auto}
.week-card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sloth-bob{animation:bob 5s ease-in-out infinite;transform-origin:0 0}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.fall{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-30px,230px) rotate(240deg)}}
.blink{animation:blink 6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* home */
.mode-card{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.mode-card .art{width:64px;height:64px;border-radius:16px;background:var(--cobalt);display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:7px;flex:none;transform:rotate(-4deg)}
.mode-card .art i{background:var(--tile);border-radius:4px;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:.7rem;color:var(--tile-ink);text-transform:uppercase}
.locked{position:relative}
.locked .padlock{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none}
.locked .padlock svg{width:22px;height:22px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mini b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.mini span{font-size:.74rem;color:var(--muted);font-weight:600}

/* settimana */
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.day .dn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--tile);color:var(--tile-ink);border:1px solid var(--tile-edge);line-height:1;text-align:center;font-size:1.05rem}
.day .dn small{display:block;font-size:.6rem;font-family:var(--f-body);font-weight:700}
.day.today{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt) inset}
.day.future{opacity:.6}
.day .sc{font-family:var(--f-display);font-weight:800;text-align:right}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rules div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.rules b{display:block;font-family:var(--f-display);font-size:1.15rem}
.rules span{font-size:.72rem;color:var(--muted);font-weight:600}
.rank{display:grid;grid-template-columns:26px 36px 1fr auto;gap:10px;align-items:center;padding:9px 0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rank .pos{font-family:var(--f-display);font-weight:800;color:var(--muted);text-align:center}
.rank.me{background:var(--cobalt-soft);border-radius:12px;padding:9px 8px;margin:0 -8px;width:calc(100% + 16px)}
.rank .sc{font-family:var(--f-display);font-weight:800;text-align:right}
.rank .avatar{width:36px;height:36px;font-size:.9rem}
.help{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.help[aria-pressed="true"]{border-color:var(--saffron);background:var(--saffron-soft)}
.token{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:50%;background:var(--saffron);color:var(--on-saffron);font-family:var(--f-display);font-weight:800;font-size:.85rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);flex:none}
.token.off{background:var(--surface-2);color:var(--muted);box-shadow:none}

/* gioco */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.timer{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;min-width:64px}
.timer.low{color:var(--coral)}
.score{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;text-align:right;min-width:64px}
.score small{display:block;font-size:.62rem;font-family:var(--f-body);color:var(--muted);font-weight:700;letter-spacing:.06em}
.tbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--cobalt);transition:width .25s linear}
.tbar.low i{background:var(--coral)}
.coach{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--saffron-soft);color:var(--ink);font-size:.92rem;animation:up .3s}
.coach b{color:var(--amber)}
.coach .ic{width:30px;height:30px;background:var(--saffron);color:var(--on-saffron)}
.board-wrap{position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.board{--n:4;--gap:10px;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);padding:12px;border-radius:22px;background:var(--cobalt);position:relative;box-shadow:inset 0 0 0 4px rgba(255,255,255,.08)}
.board::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.12;pointer-events:none;color:#fff;background:radial-gradient(circle at 50% 50%,currentColor 2px,transparent 3px) 0 0/22px 22px}
.board.n5{--n:5;--gap:8px}.board.n6{--n:6;--gap:6px;padding:10px}
.tile{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;position:relative;z-index:1;
  font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,9vw,2.6rem);text-transform:uppercase;
  box-shadow:inset 0 -5px 0 rgba(16,32,74,.16),0 2px 0 rgba(0,0,0,.15);transition:transform .08s,background .12s}
.board.n5 .tile{font-size:clamp(1.4rem,7vw,2.1rem);border-radius:12px}
.board.n6 .tile{font-size:clamp(1.1rem,5.6vw,1.7rem);border-radius:10px;box-shadow:inset 0 -4px 0 rgba(16,32,74,.16)}
.tile.sel{background:var(--tile-sel);transform:scale(.94)}
.tile.hint{animation:hint 1.2s ease-in-out infinite}
@keyframes hint{50%{background:var(--tile-sel)}}
.tile .bonus{position:absolute;top:4px;right:5px;font-size:.6rem;font-weight:800;padding:1px 5px;border-radius:6px;background:var(--coral);color:#fff;font-family:var(--f-body);text-transform:none}
.tile .bonus.x2{background:var(--mint)}
.board svg.path{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.board svg.path polyline{fill:none;stroke:var(--coral);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.board.hl .tile:not(.sel){opacity:.55}
.current{height:44px;display:flex;align-items:center;justify-content:center;gap:10px}
.current .w{font-family:var(--f-display);font-weight:800;font-size:1.7rem;letter-spacing:.06em;text-transform:uppercase}
.current .fb{font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:999px}
.fb.ok{background:var(--mint-soft);color:var(--mint)}
.fb.dup{background:var(--saffron-soft);color:var(--amber)}
.fb.no{background:var(--coral-soft);color:var(--coral)}
.fb.short{background:var(--surface-2);color:var(--muted)}
.shake{animation:shake .32s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.floater{position:absolute;z-index:5;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--mint);animation:float .9s ease-out forwards;text-shadow:0 1px 0 var(--surface)}
@keyframes float{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.combo{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;color:var(--coral);font-size:.95rem}
.combo .bar{width:70px;height:6px}
.found{display:flex;flex-wrap:wrap;gap:6px;max-height:96px;overflow:auto;align-content:flex-start}
.wchip{padding:4px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.wchip.new{border-color:var(--saffron);background:var(--saffron-soft)}
.wchip.uniq{border-color:var(--cobalt);background:var(--cobalt-soft)}
button.wchip{cursor:pointer}
button.wchip[aria-pressed="true"]{background:var(--cobalt);color:var(--on-cobalt);border-color:var(--cobalt)}
.countdown{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:22px}
.countdown b{font-family:var(--f-display);font-size:5rem;font-weight:800;color:var(--cobalt);animation:pop .9s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1)}}

/* riepilogo */
.xp-hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:6px}
.xp-hero .big{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;color:var(--amber);animation:pop .7s ease-out}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.4rem;font-weight:800;overflow-wrap:anywhere}
.stat span{font-size:.74rem;color:var(--muted);font-weight:600}
.miniboard{--n:4;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;padding:7px;border-radius:14px;background:var(--cobalt);width:176px;position:relative;flex:none}
.miniboard .tile{font-size:1rem;border-radius:7px;box-shadow:inset 0 -3px 0 rgba(16,32,74,.16)}
.miniboard.n5 .tile{font-size:.85rem}.miniboard.n6 .tile{font-size:.72rem;border-radius:5px}
.miniboard svg.path polyline{stroke-width:4}
.words-panel{display:flex;gap:14px;align-items:flex-start}
@media (max-width:420px){.words-panel{flex-direction:column;align-items:center}.words-panel>.found{width:100%}}
.words-panel .found{max-height:240px;flex:1;min-width:0}

/* sheet / toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,10,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:428px;background:var(--surface);border-radius:24px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
.sheet.center{text-align:center;align-items:center}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:min(420px,calc(100% - 32px));box-shadow:var(--shadow);animation:up .25s}
.lvl-medal{width:120px;height:120px;border-radius:32px;background:var(--saffron);color:var(--on-saffron);display:grid;place-items:center;transform:rotate(-6deg);box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),0 10px 30px rgba(240,169,42,.35);animation:medal .7s cubic-bezier(.2,1.4,.4,1)}
.lvl-medal b{font-family:var(--f-display);font-size:3.4rem;font-weight:800;transform:rotate(6deg)}
@keyframes medal{from{transform:rotate(-30deg) scale(.3);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.badge-medal{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;
  background:var(--tile);color:var(--tile-ink);border:3px solid var(--saffron);box-shadow:inset 0 -5px 0 rgba(16,32,74,.12)}
.badge-medal.week{border-color:var(--cobalt)}.badge-medal.serie{border-color:var(--coral)}
.badge-medal.locked{filter:grayscale(1);opacity:.4}
.badge-medal.big{width:108px;height:108px;font-size:1.9rem;border-radius:30px;animation:medal .7s cubic-bezier(.2,1.4,.4,1)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:none;border:0;padding:0}
.badge .n{font-size:.78rem;font-weight:700;line-height:1.2}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.cycle{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cycle i{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:700;color:var(--muted)}
.cycle i.p{background:var(--coral);color:#fff}
.cycle i.t{outline:2px solid var(--ink);outline-offset:-2px}
.cycle i.gift{background:var(--saffron-soft);color:var(--amber)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt)}
.switch[aria-pressed="true"]::after{left:21px;background:#fff}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .s{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.vs .win{color:var(--mint)}
.radio-li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.radio-li[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt) inset}
.notif{display:flex;gap:12px;padding:12px 0;align-items:flex-start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.notif.unread .t{font-weight:700}

/* mappa */
.map h3{margin-top:14px}
.map ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.map a{color:var(--cobalt);font-weight:600;text-decoration:none}
.map a:hover{text-decoration:underline}
.map .sim{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.map .sim .btn{min-height:36px;padding:7px 12px;font-size:.84rem;justify-content:flex-start}
.map .seg button{font-size:.75rem;padding:7px 2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function base(w){return Math.max(0,w.length-2)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return (h>>>0)/4294967296}
function adjN(a,b,N){return a!==b&&Math.abs((a/N|0)-(b/N|0))<=1&&Math.abs(a%N-b%N)<=1}
function findPath(g,word){const L=g.letters,N=g.N,T=L.length;
  function dfs(i,k,used){if(L[i]!==word[k])return null;used.push(i);if(k===word.length-1)return used.slice();
    for(let j=0;j<T;j++)if(!used.includes(j)&&adjN(i,j,N)){const r=dfs(j,k+1,used);if(r)return r}used.pop();return null}
  for(let i=0;i<T;i++){const r=dfs(i,0,[]);if(r)return r}return null}
function xpNeed(n){return Math.round(60*Math.pow(n,1.4))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function weekDate(d){const dt=new Date(2026,10,9+7*S.weekNo+d);return dt}
function dateLabel(d){const dt=weekDate(d);return `${DAYS[d].toLowerCase()} ${dt.getDate()} ${MONTHS[dt.getMonth()]}`}
function season(){if(S.season)return S.season;const m=weekDate(S.day).getMonth();return m<=1||m===11?"inverno":m<=4?"primavera":m<=7?"estate":"autunno"}

const duelsOpen=()=>S.level>=5;

/* ---------- avversari simulati ---------- */
function othersOf(d){ // chi ha giocato la griglia del giorno d
  if(d>S.day)return [];
  return PLAYERS.filter(p=>hash(p+"|"+S.weekNo+"|"+d)<(d===S.day?.55:.8));
}
const _ow={};
function otherWords(p,d){const k=p+d+S.weekNo;if(_ow[k])return _ow[k];const g=WEEK[d];const P={3:.12,4:.09,5:.05,6:.025,7:.012};
  return _ow[k]=g.words.filter(w=>w.length>=g.min&&hash(w+"@"+p+d)<(P[w.length]||.005)*SKILL[p]*(g.N===6?.5:1))}
function scoreList(d,words,who){const g=WEEK[d];let s=0;
  if(g.v.id==="uniche"){const others=new Set();othersOf(d).filter(p=>p!==who).forEach(p=>otherWords(p,d).forEach(w=>others.add(w)));
    if(who!=="me"&&S.week[d])S.week[d].words.forEach(w=>others.add(w));
    words.forEach(w=>s+=others.has(w)?base(w):2*base(w));return s}
  words.forEach(w=>{let m=1;if(g.v.id==="bonus"){const p=findPath(g,w)||[];p.forEach(i=>{if(g.bonus[i])m*=g.bonus[i]})}s+=base(w)*m});
  if(g.v.id==="combo"&&who!=="me")s+=Math.round(words.length*.6*SKILL[who]);
  return s}
function dayRanking(d,scope){
  const rows=othersOf(d).filter(p=>scope==="generale"||S.friends.includes(p)).map(p=>({n:p,v:scoreList(d,otherWords(p,d),p),aiuto:hash(p+"aiuto"+d)<.18}));
  const me=S.week[d];if(me)rows.push({n:"Tu",v:me.final,me:true,aiuto:me.aiuto});
  return rows.sort((a,b)=>b.v-a.v)}
function weekRanking(scope){
  const tot={};PLAYERS.forEach(p=>tot[p]=0);
  for(let d=0;d<=Math.min(S.day,6);d++)othersOf(d).forEach(p=>tot[p]+=scoreList(d,otherWords(p,d),p));
  let rows=Object.entries(tot).filter(([n,v])=>v>0&&(scope==="generale"||S.friends.includes(n))).map(([n,v])=>({n,v}));
  const mine=Object.values(S.week).reduce((s,r)=>s+r.final,0);rows.push({n:"Tu",v:mine,me:true});
  return rows.sort((a,b)=>b.v-a.v)}
function refreshUnique(){const d=6;if(S.week[d])S.week[d].final=scoreList(d,S.week[d].words,"me")}

/* ---------- audio e vibrazione ---------- */
let AC=null;
function beep(f,d=.09,type="triangle",v=.08){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function buzz(ms){if(!S.vibra)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

let route="home",gridDay=S.day;
function go(r){if(location.hash==="#"+r)render();else location.hash=r}
function current(){const h=location.hash.slice(1);return ROUTES[h]?h:"home"}
window.addEventListener("hashchange",()=>{if(S.game&&current()!=="partita"){location.hash="partita";return}render()});
const after={};
function render(){
  route=current();
  if(route==="partita"&&!S.game){location.hash="home";return}
  if(route==="riepilogo"&&!S.last){location.hash="home";return}
  if(route==="esito"&&!S.lastDuel){location.hash="sfide";return}
  const R=ROUTES[route],app=document.getElementById("app");
  app.classList.toggle("playing",!!R.playing);
  document.getElementById("topbar").innerHTML=topbar(R);
  document.getElementById("main").innerHTML=R.r();
  document.getElementById("tabbar").innerHTML=tabbar(R.tab);
  document.getElementById("mapAside").innerHTML=mapHTML();
  app.scrollTop=0;window.scrollTo(0,0);
  placeSloths();
  after[route]&&after[route]();
  if(!S.onboarded&&route==="home"&&!document.querySelector(".scrim"))welcome();
}
function topbar(R){
  const bell=`<button class="iconbtn" data-go="notizie" aria-label="Notizie">${I.bell}${unread()?`<span class="dot num">${unread()}</span>`:""}</button>`;
  if(route==="home"){const need=xpNeed(S.level);
    return `<button class="me" data-go="profilo" aria-label="Profilo, livello ${S.level}"><span class="avatar">T</span><span><span class="lvl">Livello ${S.level}</span><div class="bar"><i style="width:${S.xp/need*100}%"></i></div></span></button>
      <button class="streak" data-go="serie" aria-label="Serie: ${S.streak} giorni su 10">${I.flame}<span class="num">${S.streak}</span><small>/10</small></button>${bell}`}
  if(R.playing){const g=S.game;return `<button class="iconbtn" data-act="quit" aria-label="Abbandona la partita">${I.close}</button><div class="title">${esc(g.label)}</div>`}
  const title=route==="griglia"?`${DAYS[gridDay]} · ${WEEK[gridDay].v.name}`:R.title;
  return `${R.back?`<button class="iconbtn" data-go="${R.back}" aria-label="Indietro">${I.back}</button>`:""}<div class="title">${esc(title)}</div>
    ${route==="profilo"?`<button class="iconbtn" data-go="impostazioni" aria-label="Impostazioni">${I.gear}</button>`:""}${bell}`;
}
function tabbar(tab){
  const t=(id,label,icon,go,extra="")=>`<button class="tab" data-go="${go}" ${tab===id?'aria-current="page"':""}>${icon}<span>${label}</span>${extra}</button>`;
  return t("home","Home",I.home,"home")+t("settimana","Settimana",I.week,"settimana",weekTodo()?`<span class="dot num">${weekTodo()}</span>`:"")+
    `<button class="tab tab-play" data-go="gioca" ${tab==="gioca"?'aria-current="page"':""}><span class="fab">${I.play}</span><span>Gioca</span></button>`+
    t("sfide","Sfide",I.swords,"sfide",duelsOpen()?(toPlay()?`<span class="dot num">${toPlay()}</span>`:""):`<span class="lock">${I.lock}</span>`)+
    t("profilo","Profilo",I.user,"profilo");
}
const weekTodo=()=>{let n=0;for(let d=0;d<=Math.min(S.day,6);d++)if(!S.week[d])n++;return n};

const BRANCH="M -14 186 C 70 176, 120 156, 175 122 S 290 56, 376 30";
function sceneSVG(big){
  const s=SEASONS[season()],id="sc"+Math.random().toString(36).slice(2,7);
  const leaves=[];const L=s.leaf;
  if(L.length){for(let i=0;i<26;i++){const t=.04+i*.036,ox=(hash("x"+i)-.5)*26,oy=-6-hash("y"+i)*20,r=hash("r"+i)*360,c=L[i%L.length];
      leaves.push(`<ellipse data-t="${t}" data-ox="${ox}" data-oy="${oy}" rx="${s.fall==="petal"&&i%2?4:6}" ry="${s.fall==="petal"&&i%2?4:3}" fill="${c}" transform="rotate(${r})" class="lf"/>`)}}
  const falls=[];if(s.fall){for(let i=0;i<9;i++){const x=20+i*40+hash("f"+i)*20,dur=7+hash("d"+i)*6,del=-hash("e"+i)*12;
      const shape=s.fall==="snow"?`<circle r="${2+hash("s"+i)*2}" fill="#fff"/>`:s.fall==="petal"?`<ellipse rx="4" ry="3" fill="${L[i%2]}"/>`:`<ellipse rx="5" ry="2.6" fill="${L[i%L.length]}"/>`;
      falls.push(`<g transform="translate(${x},0)"><g class="fall" style="animation-duration:${dur}s;animation-delay:${del}s">${shape}</g></g>`)}}
  const twigs=[[.22,-28,-26],[.45,-20,-30],[.62,24,-22],[.8,-26,-24],[.32,20,18]];
  return `<svg class="scene" viewBox="0 0 360 ${big?210:190}" role="img" aria-label="Il bradipo sale sul ramo della settimana: ${DAYS[Math.min(S.day,6)]}">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.sky[0]}"/><stop offset="1" stop-color="${s.sky[1]}"/></linearGradient></defs>

  <circle cx="300" cy="${big?150:140}" r="26" fill="${s.sun}" opacity=".85"/>
  <path d="M0 ${big?170:156} Q 80 ${big?140:128} 170 ${big?162:150} T 360 ${big?150:138} V210 H0Z" fill="${s.hills[0]}"/>

  <g class="falls">${falls.join("")}</g>
  <g class="twigs">${twigs.map(([t,dx,dy])=>`<path data-t="${t}" data-dx="${dx}" data-dy="${dy}" class="twig" stroke="${s.bark}" stroke-width="4" stroke-linecap="round" fill="none"/>`).join("")}</g>
  <path class="branch" d="${BRANCH}" stroke="${s.bark}" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="${BRANCH}" stroke="rgba(255,255,255,.18)" stroke-width="3" stroke-linecap="round" fill="none" transform="translate(0,-4)"/>
  ${s.snow?`<path d="${BRANCH}" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" transform="translate(0,-6)"/>`:""}
  <g class="leaves">${leaves.join("")}</g>

    <path d="M-20 0 Q-26 12 -14 20" stroke="#7d5f45" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M-8 0 Q-12 12 -4 20" stroke="#7d5f45" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M6 0 Q2 12 8 20" stroke="#7d5f45" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M17 0 Q20 12 14 20" stroke="#7d5f45" stroke-width="7" stroke-linecap="round" fill="none"/>

    <ellipse cx="0" cy="24" rx="22" ry="12" fill="#8a6a4f"/>
    <path d="M-16 20 q4 3 8 0 M-4 28 q4 3 8 0 M6 19 q4 3 8 0" stroke="#6f533c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="24" r="11" fill="#a3825f"/>

function placeSloths(){
  const now=new Date(),frac=(now.getHours()*60+now.getMinutes())/1440;
  document.querySelectorAll("svg.scene").forEach(svg=>{

function startGame(kind,opt){

  if(kind==="gioca"||kind==="guided"){grid=GIOCA[S.giocaIdx%GIOCA.length];S.giocaIdx++;label=kind==="guided"?"Prima partita":"Gioca · 5×5"}
  else if(kind==="week"){const w=WEEK[opt.day];grid=w;dur=w.dur+(opt.aiuto?10:0);min=w.min;bonus=w.bonus;variant=w.v.id;label=`${DAYS[opt.day]} · ${w.v.name}${opt.aiuto?" · +10 s":""}`}
  else{grid=DUEL;label=`Sfida con ${opt.opp}`;variant="versus"}
  let hint=null;if(kind==="guided"){const w=grid.hint||grid.words.find(x=>x.length===4);hint={word:w,path:findPath(grid,w),step:0}}
  S.game={kind,day:opt&&opt.day,aiuto:opt&&opt.aiuto,opp:opt&&opt.opp,cid:opt&&opt.cid,grid,variant,dur:dur*1000,left:dur*1000,min,bonus,
    found:[],score:0,combo:0,maxCombo:0,lastAt:0,path:[],running:false,countdown:kind==="guided"?0:3,label,hint,paused:kind==="guided"};
  go("partita");
}
function vGame(){

  const coach=g.hint?coachHTML():"";
  return `${coach}
  <div class="hud">
    <div class="timer num ${g.left<=15000?"low":""}" id="timer">${mmss(g.left)}</div>
    <div class="tbar ${g.left<=15000?"low":""}" id="tbar"><i style="width:${g.left/g.dur*100}%"></i></div>
    <div class="score num" id="score">${g.score}<small>PUNTI</small></div>
  </div>
  <div class="board-wrap" id="bw">
    <div class="board n${N}" id="board">
      ${g.grid.letters.map((l,i)=>`<div class="tile ${g.hint&&g.hint.step===0&&g.hint.path.includes(i)?"hint":""}" data-i="${i}">${l}${g.bonus[i]?`<span class="bonus ${g.bonus[i]===2?"x2":""}">×${g.bonus[i]}</span>`:""}</div>`).join("")}
      <svg class="path" id="pathsvg"><polyline points=""/></svg>
    </div>
    ${g.countdown?`<div class="countdown" id="cd"><b>${g.countdown}</b></div>`:""}
  </div>
  <div class="current" id="cur" aria-live="polite"></div>
  <div class="row between"><span class="muted num small" id="fcount">${g.found.length} ${g.found.length===1?"parola":"parole"} · ${g.min>3?"minimo 4 lettere":"minimo 3 lettere"}</span><span class="combo" id="combo"></span></div>
  <div class="found" id="found"></div>`;
}
function coachHTML(){const h=S.game.hint;const T=[
  `Trascina il dito su lettere vicine, anche in diagonale, senza staccarlo. Prova con <b>${h.word.toUpperCase()}</b>: le lettere lampeggiano. Il tempo parte dopo la prima parola.`,
  `Ottimo! Ogni parola vale punti: <b>1 per 3 lettere, +1 per ogni lettera in più</b>. A fine partita i punti diventano XP e ti fanno salire di livello.`,
  `Le parole in <b>giallo</b> sono nuove per te: entrano nelle tue <b>parole trovate</b>. Più parole diverse scopri, più la collezione cresce.`];
  return h.step<3?`<div class="coach" id="coach"><span class="ic">${I.spark}</span><span>${T[h.step]}</span></div>`:""}
function mmss(ms){const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
let tick=null;
after.partita=function(){
  const g=S.game;bindBoard();
  if(g.countdown){const cd=()=>{g.countdown--;const el=document.getElementById("cd");if(!el)return;
      if(g.countdown<=0){el.remove();startClock()}else{el.innerHTML=`<b>${g.countdown}</b>`;beep(520);setTimeout(cd,700)}};beep(520);setTimeout(cd,700)}
  else if(!g.paused)startClock();
};
function startClock(){const g=S.game;g.countdown=0;g.paused=false;g.running=true;g.t0=performance.now()-(g.dur-g.left);beep(880,.15);clearInterval(tick);
  tick=setInterval(()=>{const g=S.game;if(!g||!g.running){clearInterval(tick);return}
    g.left=Math.max(0,g.dur-(performance.now()-g.t0));
    const t=document.getElementById("timer"),b=document.getElementById("tbar");
    if(t){t.textContent=mmss(g.left);t.classList.toggle("low",g.left<=15000)}
    if(b){b.firstElementChild.style.width=(g.left/g.dur*100)+"%";b.classList.toggle("low",g.left<=15000)}
    if(g.left<=10000&&Math.ceil(g.left/1000)!==g.lastTick){g.lastTick=Math.ceil(g.left/1000);beep(300,.05,"sine",.04)}
    if(g.combo>=2&&performance.now()-g.lastAt>5000)g.combo=0;
    const c=document.getElementById("combo");if(c)c.innerHTML=g.variant==="combo"&&g.combo>=2?`Combo ×${g.combo}<span class="bar coral"><i style="width:${Math.max(0,1-(performance.now()-g.lastAt)/5000)*100}%;transition:none"></i></span>`:"";
    if(g.left<=0)endGame();
  },100)}
function bindBoard(){
  const board=document.getElementById("board");if(!board)return;const g=S.game;let active=false;
  const tileAt=(x,y)=>{const el=document.elementFromPoint(x,y);const t=el&&el.closest(".tile");if(!t||!board.contains(t))return -1;
    const r=t.getBoundingClientRect();return Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2)<=r.width*.48?+t.dataset.i:-1};
  const draw=()=>{const tiles=board.querySelectorAll(".tile");tiles.forEach((t,i)=>t.classList.toggle("sel",g.path.includes(i)));drawPath(board,g.path);
    const w=g.path.map(i=>g.grid.letters[i]).join("");document.getElementById("cur").innerHTML=w?`<span class="w">${w}</span>`:""};
  board.addEventListener("pointerdown",e=>{if(g.countdown||!S.game)return;const i=tileAt(e.clientX,e.clientY);if(i<0)return;
    active=true;g.path=[i];board.setPointerCapture(e.pointerId);draw();beep(400+g.path.length*40,.04,"sine",.03);e.preventDefault()});
  board.addEventListener("pointermove",e=>{if(!active)return;const i=tileAt(e.clientX,e.clientY);if(i<0)return;const p=g.path;if(i===p[p.length-1])return;
    if(p.length>1&&i===p[p.length-2]){p.pop();draw();return}
    if(!p.includes(i)&&adjN(p[p.length-1],i,g.grid.N)){p.push(i);draw();beep(400+p.length*40,.04,"sine",.03)}});
  const up=()=>{if(!active)return;active=false;submit()};
  board.addEventListener("pointerup",up);board.addEventListener("pointercancel",up);
}
function drawPath(board,path){const tiles=board.querySelectorAll(".tile"),br=board.getBoundingClientRect();
  board.querySelector("polyline").setAttribute("points",path.map(i=>{const r=tiles[i].getBoundingClientRect();return `${r.left-br.left+r.width/2},${r.top-br.top+r.height/2}`}).join(" "))}
function isNew(w){return !S.collection.has(w)}
function submit(){
  const g=S.game,w=g.path.map(i=>g.grid.letters[i]).join(""),cur=document.getElementById("cur"),board=document.getElementById("board");let fb,cls;
  if(w.length<g.min){fb=g.min>3&&w.length>=3?"Minimo 4 lettere":"Troppo corta";cls="short"}
  else if(g.found.includes(w)){fb="Già trovata";cls="dup"}
  else if(!g.grid.set.has(w)){fb="Non nel dizionario";cls="no"}
  else{
    let mult=1;g.path.forEach(i=>{if(g.bonus[i])mult*=g.bonus[i]});
    const now=performance.now();g.combo=(g.combo>=1&&now-g.lastAt<=5000)?g.combo+1:1;g.lastAt=now;g.maxCombo=Math.max(g.maxCombo,g.combo);
    const extra=g.variant==="combo"&&g.combo>=2?g.combo-1:0;
    const pts=base(w)*mult+extra;g.found.push(w);g.score+=pts;
    fb=`+${pts}${mult>1?` (×${mult})`:""}${extra?` (combo +${extra})`:""}`;cls="ok";buzz(15);
    beep(520+Math.min(g.combo,8)*50,.12);if(w.length>=6)setTimeout(()=>beep(990,.15),90);
    const last=g.path[g.path.length-1],t=board.querySelectorAll(".tile")[last],br=document.getElementById("bw").getBoundingClientRect(),r=t.getBoundingClientRect();
    const f=document.createElement("div");f.className="floater";f.textContent="+"+pts;f.style.left=(r.left-br.left+r.width/2)+"px";f.style.top=(r.top-br.top)+"px";
    document.getElementById("bw").appendChild(f);setTimeout(()=>f.remove(),900);
    document.getElementById("score").innerHTML=`${g.score}<small>PUNTI</small>`;
    document.getElementById("fcount").textContent=`${g.found.length} ${g.found.length===1?"parola":"parole"} · ${g.min>3?"minimo 4 lettere":"minimo 3 lettere"}`;
    document.getElementById("found").innerHTML=g.found.slice().reverse().map(x=>`<span class="wchip ${isNew(x)?"new":""}">${x}</span>`).join("");
    if(w.length>=7)toast(`Parola da ${w.length} lettere: ${w.toUpperCase()}`);
    if(g.hint&&g.hint.step<3){if(g.hint.step===0){g.hint.step=1;board.querySelectorAll(".hint").forEach(x=>x.classList.remove("hint"));startClock()}
      else if(g.found.length>=3&&g.hint.step===1)g.hint.step=2;
      else if(g.found.length>=6&&g.hint.step===2)g.hint.step=3;
      const c=document.getElementById("coach");if(c)c.outerHTML=coachHTML()||"";}
  }
  cur.innerHTML=`${w?`<span class="w">${w}</span>`:""}<span class="fb ${cls}">${fb}</span>`;
  if(cls==="no"){board.classList.remove("shake");void board.offsetWidth;board.classList.add("shake");beep(160,.15,"sawtooth",.04);buzz([20,40,20])}
  setTimeout(()=>{if(!S.game)return;g.path=[];board.querySelectorAll(".tile").forEach(t=>t.classList.remove("sel"));board.querySelector("polyline").setAttribute("points","")},cls==="ok"?160:260);
  clearTimeout(g.fbT);g.fbT=setTimeout(()=>{const c=document.getElementById("cur");if(c&&!g.path.length)c.innerHTML=""},1200);
}

function endGame(){
  const g=S.game;if(!g)return;g.running=false;clearInterval(tick);beep(440,.2);setTimeout(()=>beep(330,.3),180);buzz(80);
  const got=[];
  const newWords=g.found.filter(isNew);newWords.forEach(w=>S.collection.add(w));
  g.found.forEach(w=>{if(w.length>S.longest.length)S.longest=w});
  S.games++;
  let final=g.score,provisional=false;
  if(g.kind==="week"){S.week[g.day]={words:g.found.slice(),score:g.score,final:g.score,aiuto:!!g.aiuto,onDay:g.day===S.day};
    if(g.variant==="uniche"){refreshUnique();final=S.week[g.day].final;provisional=true}
    S.variantsPlayed.add(g.variant);award("sett1",got);if(S.variantsPlayed.size>=7)award("tutto",got);
    if(Object.keys(S.week).length===7){award("sett7",got);if(Object.values(S.week).every(r=>r.onDay))award("puntuale",got)}}
  // serie
  let serieGift=false,serieUp=false;
  if(!S.playedToday){S.playedToday=true;S.streak++;serieUp=true;if(S.streak>=10){S.streak=0;S.cycles++;S.aiuti++;serieGift=true;award("ciclo",got)}}
  // medaglie
  if(g.found.length)award("parola",got);award("partita",got);
  if(S.collection.size>=100)award("p100",got);if(S.collection.size>=1000)award("p1000",got);if(S.collection.size>=10000)award("p10000",got);
  if(g.found.some(w=>w.length>=7))award("l7",got);if(g.found.some(w=>w.length>=9))award("l9",got);if(g.found.length>=30)award("w30",got);
  // XP
  const before=S.level;addXP(final);if(S.level>=10)award("lv10",got);
  S.last={kind:g.kind,day:g.day,grid:g.grid,found:g.found.slice(),score:g.score,final,provisional,newWords,label:g.label,levelBefore:before,levels:S.level-before,got,serieUp,serieGift,aiuto:g.aiuto,maxCombo:g.maxCombo,variant:g.variant};
  S.ui.sumSel=null;S.ui.sumTab="trovate";if(g.kind==="guided")S.onboarded=true;
  if(S.level>before)pending.push(()=>levelModal(before));
  if(serieGift)pending.push(giftModal);
  got.forEach(m=>pending.push(()=>medalModal(m)));
  const kind=g.kind,cid=g.cid;S.game=null;
  if(kind==="duel"){finishDuel(cid);return}
  go("riepilogo");
}

function vSettings(){const sw=(k,t,s)=>`<div class="li"><span class="grow"><b>${t}</b><br><span class="muted small">${s}</span></span><button class="switch" data-toggle="${k}" aria-pressed="${S[k]}" aria-label="${t}"></button></div>`;
  return `<section class="card"><div class="list">${sw("sound","Suoni","Effetti durante la partita")}${sw("vibra","Vibrazione","Un tocco leggero a ogni parola trovata")}${sw("remind","Promemoria serie","Uno solo alle 20:00, se oggi non hai giocato")}</div></section>
  <section class="card stack"><h3>Tema</h3><div class="seg">${[["system","Sistema"],["light","Chiaro"],["dark","Scuro"]].map(([k,t])=>`<button data-themeset="${k}" aria-pressed="${S.theme===k}">${t}</button>`).join("")}</div></section>
  <section class="card stack"><h3>Stagione del bradipo</h3><div class="seg">${[["","Auto"],["autunno","Autunno"],["inverno","Inverno"],["primavera","Primav."],["estate","Estate"]].map(([k,t])=>`<button data-season="${k}" aria-pressed="${(S.season||"")===k}">${t}</button>`).join("")}</div><p class="muted small">In automatico la scena segue il periodo dell'anno.</p></section>`}
function vNotifs(){return `<section class="card" style="padding-block:4px"><div class="list">${S.notifs.map(n=>`<div class="notif ${n.unread?"unread":""}" ${n.go?`data-ngo="${n.id}" role="button" tabindex="0"`:""}><span class="ic ${n.c}">${I[n.ic]}</span><span style="flex:1;min-width:0"><span class="t" style="display:block">${esc(n.t)}</span><span class="muted small">${esc(n.s)}</span>
  ${n.friend&&!n.done?`<div class="row" style="gap:6px;margin-top:8px"><button class="btn btn-ghost btn-sm" data-friend="${n.id}" data-ans="no">Ignora</button><button class="btn btn-primary btn-sm" data-friend="${n.id}" data-ans="yes">Accetta</button></div>`:""}</span><span class="muted" style="font-size:.75rem;white-space:nowrap">${n.when}</span></div>`).join("")}</div></section>
  ${unread()?`<button class="btn btn-quiet btn-block" data-act="readall">Segna tutte come lette</button>`:""}`}

/* ---------- mappa e simulazioni ---------- */
function mapHTML(){const L=(h,t)=>`<li><a href="#${h}">${t}</a></li>`;
  return `<span class="eyebrow">Prototipo</span><h2>Mappa dei flussi</h2>
  <p class="muted small" style="margin-top:4px">Nessun server: avversari e classifiche sono simulati. Le griglie sono vere, risolte col dizionario del progetto.</p>
  <h3>1. Primo accesso</h3><ol><li>Benvenuto</li><li>Prima partita guidata</li><li>Riepilogo e presentazione della Home</li></ol>
  <h3>2. Gioca</h3><ol>${L("gioca","Partita libera 5×5")}<li>Partita</li><li>Riepilogo con le parole mancate</li></ol>
  <h3>3. Settimana</h3><ol>${L("settimana","Il ramo e le 7 griglie")}<li>Scheda della griglia, aiuto</li><li>Partita e riepilogo</li><li>Chi l'ha giocata, parole degli altri</li></ol>
  <h3>4. Progressione</h3><ol>${L("profilo","Profilo")}${L("parole","Parole trovate")}${L("medaglie","Medaglie")}${L("serie","Serie e aiuti")}${L("impostazioni","Impostazioni")}</ol>
  <h3>5. Sfide (livello 5)</h3><ol>${L("sfide","Sfide")}${L("nuova-sfida","Nuova sfida")}${L("notizie","Notizie e amici")}</ol>
  <h3>Simula</h3><div class="sim">
    <button class="btn btn-ghost" data-act="sim-reset">Nuovo giocatore</button>
    <button class="btn btn-ghost" data-act="sim-skipob">Salta la partita guidata</button>
    <button class="btn btn-ghost" data-act="sim-xp">+300 XP</button>
    <button class="btn btn-ghost" data-act="sim-l5">Arriva al livello 5</button>
    <button class="btn btn-ghost" data-act="sim-day">Passa al giorno dopo</button>
    <button class="btn btn-ghost" data-act="sim-skip">Salta un giorno senza giocare</button>
    <button class="btn btn-ghost" data-act="sim-s9">Porta la serie a 9 giorni</button>
    <button class="btn btn-ghost" data-act="sim-friends">Diventa amico di Giulia e Luca</button>
    <button class="btn btn-ghost" data-act="sim-chal">Giulia ti sfida</button>
  </div>
  <h3>Stagione</h3><div class="seg" style="margin-top:6px">${[["","Auto"],["autunno","Aut."],["inverno","Inv."],["primavera","Pri."],["estate","Est."]].map(([k,t])=>`<button data-season="${k}" aria-pressed="${(S.season||"")===k}">${t}</button>`).join("")}</div>`}

/* ---------- overlay ---------- */
function sheet(html,cls=""){const o=document.getElementById("overlay");o.innerHTML=`<div class="scrim" data-scrim><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;const b=o.querySelector(".sheet button");b&&b.focus()}
function closeSheet(){document.getElementById("overlay").innerHTML="";nextModal()}
function toast(t){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function welcome(){sheet(`<span class="eyebrow">Benvenuto</span><h1>Trova parole, scopri parole</h1>
  <p class="muted">Trascina il dito sulle lettere per comporre parole. Ogni punto che fai diventa esperienza, e ogni parola nuova entra nella tua collezione.</p>
  <p class="muted">Cominciamo con una partita guidata: il tempo parte solo dopo la prima parola.</p>
  <button class="btn btn-gold btn-block" data-act="start-guided">Gioca la prima partita</button>`,"center")}
function afterGuided(){sheet(`<span class="eyebrow">Fatto!</span><h1>La tua Home</h1>
  <p class="muted">Ogni giorno un bradipo sale di un passo sul ramo della <b>Settimana</b>: a ogni giorno corrisponde una griglia nuova, uguale per tutti, con regole diverse. Le griglie perse si recuperano fino a domenica.</p>
  <p class="muted">In <b>Gioca</b> fai pratica quando vuoi. Le <b>Sfide</b> fra amici si sbloccano al livello 5.</p>
  <button class="btn btn-primary btn-block" data-act="to-home">Vai alla Home</button>`,"center")}
function levelModal(before){beep(523,.12);setTimeout(()=>beep(659,.12),120);setTimeout(()=>beep(784,.12),240);setTimeout(()=>beep(1047,.3),360);
  const unlocked=before<5&&S.level>=5;
  sheet(`<span class="eyebrow">Nuovo livello</span><div class="lvl-medal"><b class="num">${S.level}</b></div><h1>Livello ${S.level}</h1>
  ${unlocked?`<p><b>Hai sbloccato le Sfide.</b> Ora puoi sfidare i tuoi amici del portale${S.challenges.length?", e c'è già qualcuno che ti aspetta":""}.</p><button class="btn btn-primary btn-block" data-act="close-go" data-to="sfide">Apri le Sfide</button>`
  :`<p class="muted">Prossimo livello a ${fmt(xpNeed(S.level))} XP.${S.level<5?` Le Sfide si sbloccano al livello 5.`:""}</p>`}
  <button class="btn ${unlocked?"btn-quiet":"btn-gold"} btn-block" data-close>Continua</button>`,"center")}
function giftModal(){beep(784,.1);setTimeout(()=>beep(1175,.25),120);
  sheet(`<span class="eyebrow">Serie di 10 giorni completata</span><span class="token" style="width:96px;height:96px;font-size:1.5rem">+10 s</span><h1>Un aiuto per te</h1>
  <p class="muted">Lo puoi usare in una griglia della Settimana: 10 secondi in più, stessa griglia. Ora hai ${S.aiuti} ${S.aiuti===1?"aiuto":"aiuti"}. La serie riparte da zero.</p><button class="btn btn-gold btn-block" data-close>Continua</button>`,"center")}
function medalModal(m){beep(784,.1);setTimeout(()=>beep(1175,.25),120);
  sheet(`<span class="eyebrow">Medaglia</span><span class="badge-medal big ${m[4]}">${m[2]}</span><h1>${m[1]}</h1><p class="muted">${esc(m[3])}</p><button class="btn btn-primary btn-block" data-close>Continua</button>`,"center")}

/* ---------- azioni ---------- */
function onAct(el){
  const d=el.dataset;
  if(d.close!==undefined){closeSheet();return}
  if(d.go){go(d.go);return}
  if(d.day){gridDay=+d.day;S.ui.helpOn=false;go("griglia");return}
  if(d.gridday){gridDay=+d.gridday;S.ui.helpOn=false;go("griglia");return}
  if(d.rank){S.ui.rank=d.rank;render();return}
  if(d.grank){S.ui.grank=d.grank;render();return}
  if(d.sumtab){S.ui.sumTab=d.sumtab;S.ui.sumSel=null;render();return}
  if(d.sumword){S.ui.sumSel=S.ui.sumSel===d.sumword?null:d.sumword;const a=document.getElementById("app").scrollTop,y=window.scrollY;render();window.scrollTo(0,y);document.getElementById("app").scrollTop=a;return}
  if(d.wlen){S.ui.wordsLen=d.wlen;const v=(document.getElementById("wq")||{}).value||"";render();const q=document.getElementById("wq");q.value=v;q.dispatchEvent(new Event("input"));return}
  if(d.peek){const ws=otherWords(d.peek,gridDay);sheet(`<h2>Le parole di ${esc(d.peek)}</h2><p class="muted small">${ws.length} parole su ${DAYS[gridDay].toLowerCase()}. In blu quelle che hai trovato anche tu.</p><div class="found" style="max-height:50vh">${ws.sort((a,b)=>b.length-a.length).map(w=>`<span class="wchip ${S.week[gridDay].words.includes(w)?"uniq":""}">${w}</span>`).join("")}</div><button class="btn btn-ghost btn-block" data-close>Chiudi</button>`);return}
  if(d.medal){const m=MEDALS.find(x=>x[0]===d.medal),got=S.medals.has(m[0]),p=!got&&m[5]?m[5]():null;sheet(`<span class="badge-medal big ${m[4]} ${got?"":"locked"}">${m[2]}</span><h1>${m[1]}</h1><p class="muted">${esc(m[3])}</p>${p?`<p class="num"><b>${fmt(Math.min(p[0],p[1]))}</b> / ${fmt(p[1])}</p>`:""}<button class="btn btn-ghost btn-block" data-close>Chiudi</button>`,"center");return}
  if(d.toggle){S[d.toggle]=!S[d.toggle];render();return}
  if(d.themeset){S.theme=d.themeset;if(d.themeset==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",d.themeset);render();return}
  if(d.season!==undefined){S.season=d.season||null;render();return}
  if(d.friend){const n=S.notifs.find(x=>x.id==+d.friend);n.done=true;n.unread=false;if(d.ans==="yes"){S.friends.push(n.friend);n.t=`${n.friend} ora è tuo amico`;n.s="Lo trovi nelle classifiche Amici"}else{n.t=`Richiesta di ${n.friend} ignorata`;n.s=""}render();return}
  if(d.ngo){const n=S.notifs.find(x=>x.id==+d.ngo);n.unread=false;go(n.go);return}
  if(d.pick){S.ui.newOpp=d.pick;render();return}
  if(d.cplay){const c=S.challenges.find(x=>x.id==+d.cplay);startGame("duel",{opp:c.opp,cid:c.id});return}
  if(d.csim){resolveDuel(S.challenges.find(x=>x.id==+d.csim));return}
  if(d.crematch){const c=S.challenges.find(x=>x.id==+d.crematch);S.challenges.unshift({id:Date.now(),opp:c.opp,status:"tocca",oppPlayed:false});toast(`Rivincita inviata a ${c.opp}.`);go("sfide");return}
  switch(d.act){
    case "start-guided":document.getElementById("overlay").innerHTML="";startGame("guided",{});break;
    case "to-home":document.getElementById("overlay").innerHTML="";go("home");break;
    case "close-go":document.getElementById("overlay").innerHTML="";go(d.to);nextModal();break;
    case "start-gioca":startGame("gioca",{});break;
    case "togglehelp":S.ui.helpOn=!S.ui.helpOn;render();break;
    case "start-week":{const aiuto=S.ui.helpOn&&S.aiuti>0;sheet(`<h2>Un solo tentativo</h2><p class="muted">${DAYS[gridDay]} · ${WEEK[gridDay].v.name}. Quando inizi, il tempo non si ferma. Se esci a metà conta il punteggio fatto fino a quel momento.${aiuto?" Userai un aiuto: +10 secondi.":""}</p><div class="row" style="gap:8px"><button class="btn btn-ghost" style="flex:1" data-close>Non ora</button><button class="btn btn-gold" style="flex:1" data-act="go-week">Inizia</button></div>`);break}
    case "go-week":{document.getElementById("overlay").innerHTML="";const aiuto=S.ui.helpOn&&S.aiuti>0;if(aiuto)S.aiuti--;S.ui.helpOn=false;startGame("week",{day:gridDay,aiuto});break}
    case "quit":{const g=S.game;sheet(`<h2>Abbandoni la partita?</h2><p class="muted">${g.kind==="week"?"Il tentativo resta usato: conta il punteggio fatto finora.":"La partita finisce qui e conta il punteggio fatto finora."}</p><div class="row" style="gap:8px"><button class="btn btn-ghost" style="flex:1" data-close>Continua</button><button class="btn btn-primary" style="flex:1" data-act="endgame">Termina</button></div>`);break}
    case "endgame":document.getElementById("overlay").innerHTML="";if(S.game&&S.game.hint)S.game.hint.step=3;endGame();break;
    case "send-duel":{const opp=S.ui.newOpp||S.friends[0],locked=(PLAYER_LEVEL[opp]||1)<5;S.challenges.unshift({id:Date.now(),opp,status:"tocca",oppPlayed:false,lockedOpp:locked});
      if(locked)toast(`Sfida inviata. ${opp} la vedrà al livello 5; tu puoi già giocare.`);else toast(`Sfida inviata a ${opp}. Gioca il tuo turno quando vuoi.`);
      go("sfide");break}
    case "readall":S.notifs.forEach(n=>n.unread=false);render();break;
    case "sim-reset":clearInterval(tick);pending.length=0;initState();document.documentElement.removeAttribute("data-theme");document.getElementById("overlay").innerHTML="";go("home");break;
    case "sim-skipob":S.onboarded=true;document.getElementById("overlay").innerHTML="";render();break;
    case "sim-xp":{const b=S.level;addXP(300);if(S.level>b)levelModal(b);else render();toast("+300 XP");break}
    case "sim-l5":{const b=S.level;if(S.level<5){S.level=5;S.xp=0;render();levelModal(b)}break}
    case "sim-day":newDay(false);break;
    case "sim-skip":newDay(true);break;
    case "sim-s9":S.streak=9;S.playedToday=false;render();toast("Serie a 9: la prossima partita completa il ciclo.");break;
    case "sim-friends":["Giulia","Luca"].forEach(f=>{if(!S.friends.includes(f))S.friends.push(f)});render();toast("Giulia e Luca ora sono tuoi amici.");break;
    case "sim-chal":{if(!S.friends.includes("Giulia"))S.friends.push("Giulia");S.challenges.unshift({id:Date.now(),opp:"Giulia",status:"tocca",oppPlayed:true});
      S.notifs.unshift({id:Date.now(),ic:"swords",c:"ic-coral",t:"Giulia ti ha sfidato",s:duelsOpen()?"La trovi nelle Sfide":"La vedrai quando sblocchi le Sfide, al livello 5",go:"sfide",unread:true,when:"adesso"});render();toast("Giulia ti ha sfidato.");break}
  }
}
document.addEventListener("click",e=>{const el=e.target.closest("button,[data-scrim],[data-ngo]");if(!el)return;
  if(el.hasAttribute("data-scrim")){if(e.target===el)closeSheet();return}
  if(el.dataset.ngo&&e.target.closest("button"))return;
  onAct(el)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".scrim"))closeSheet();if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.ngo)onAct(e.target)});
function newDay(skip){
  const steps=skip?2:1;
  for(let k=0;k<steps;k++){
    if(!S.playedToday&&S.streak>0){S.streak=0;toast("Ieri non hai giocato: la serie riparte da zero.")}
    S.playedToday=false;S.day++;
    if(S.day>6){ // chiusura settimana
      for(let d=0;d<7;d++){if(S.week[d]){const rows=dayRanking(d,"generale");if(rows[0]&&rows[0].me){S.medals.add("primo")}}}
      S.weekNo++;S.day=0;S.week={};for(const k in _ow)delete _ow[k];
      S.notifs.unshift({id:Date.now()+k,ic:"week",c:"ic-blue",t:"È iniziata una nuova settimana",s:"Il bradipo riparte da lunedì",go:"settimana",unread:true,when:"adesso"});
    }
  }
  refreshUnique();
  S.notifs.unshift({id:Date.now(),ic:"week",c:"ic-blue",t:`La griglia di ${DAYS[S.day].toLowerCase()} è disponibile`,s:`Variante: ${WEEK[S.day].v.name}`,go:"settimana",unread:true,when:"adesso"});
  if(!skip)toast(`È ${dateLabel(S.day)}.`);
  go("home");
}
render();
})();
</script>
