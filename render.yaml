databases:
  - name: paroliere-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: paroliere-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@9 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @paroliere/server exec tsx src/db/migrate.ts && pnpm --filter @paroliere/server exec tsx src/index.ts
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: paroliere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      # URL assegnato di default da Render (<nome-servizio>.onrender.com); se in dashboard
      # scegli un nome diverso da "paroliere-web" o un domain custom, aggiorna questo valore.
      - key: CORS_ORIGIN
        value: https://paroliere-web.onrender.com

  - type: web
    name: paroliere-web
    runtime: static
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@9 --activate && pnpm install --frozen-lockfile && pnpm --filter @paroliere/web run build
    staticPublishPath: apps/web/dist
    envVars:
      # come sopra: aggiorna se il nome del servizio server cambia in dashboard.
      - key: VITE_API_URL
        value: https://paroliere-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
