# Versione OFFLINE (attiva): solo frontend statico, nessun server né database.
# Per tornare alla versione con backend (login, sfide): sostituire il contenuto
# di questo file con quello di render.with-backend.yaml.
services:
  - type: web
    name: paroliere-web
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @paroliere/web run build
    staticPublishPath: apps/web/dist
    envVars:
      # true = build senza backend (solo allenamento e storico locale).
      - key: VITE_OFFLINE_MODE
        value: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
